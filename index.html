<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Luca Cesta aka LiM — SysAdmin, Developer e appassionato di internet.">

  <title>Luca Cesta · LiM</title>
  <link rel="icon" type="image/png" href="logo-lim-dark.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <script src="https://kit.fontawesome.com/9f2d68c7ba.js" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Background -->
  <div class="bg-gradient"></div>

  <!--
    Each .orb handles the drift animation (CSS transform);
    its child .orb-inner handles the fade-in (CSS opacity).
    The two animations no longer conflict on the transform property.
  -->
  <div class="orb orb-1">
    <div class="orb-inner"></div>
  </div>
  <div class="orb orb-2">
    <div class="orb-inner"></div>
  </div>
  <div class="orb orb-3">
    <div class="orb-inner"></div>
  </div>

  <!-- Profile picture watermark, bottom-right corner -->
  <img src="propic.svg" alt="" class="propic-watermark" aria-hidden="true">

  <!-- Page -->
  <main class="page">
    <div class="grid">

      <!-- LEFT: identity -->
      <article class="card card-hero" id="card-hero">
        <div class="card-shine"></div>

        <!-- Name + aka -->
        <div class="name-wrap">
          <h1 class="name"><!-- filled by JS --></h1>
          <p class="aka"><!-- filled by JS --></p>
        </div>
        <p class="bio"><!-- filled by JS --></p>
        <div class="skills" id="skills-container"></div>
      </article>

      <!-- RIGHT: links -->
      <nav class="card card-links" id="links-container" aria-label="Link principali">
        <div class="card-shine"></div>
      </nav>

    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
